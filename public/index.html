<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiveHaul</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top bar */
    #topbar {
      height: 48px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 20px;
      flex-shrink: 0;
      z-index: 1000;
    }

    .logo {
      font-weight: 800;
      font-size: 15px;
      color: #60a5fa;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    #companies-bar { display: flex; gap: 10px; }

    .company-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      background: #0f172a;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 13px;
    }

    .company-dot { width: 9px; height: 9px; border-radius: 50%; }
    .company-balance { font-weight: 600; color: #4ade80; }

    #connection-status {
      margin-left: auto;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
    .status-dot.connected { background: #4ade80; }

    /* Main */
    #main { flex: 1; display: flex; overflow: hidden; }
    #map  { flex: 1; z-index: 1; }

    /* Sidebar */
    #sidebar {
      width: 272px;
      background: #1e293b;
      border-left: 1px solid #334155;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    .panel { border-bottom: 1px solid #334155; padding: 12px 14px; }
    .panel-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #475569;
      margin-bottom: 8px;
    }

    #vehicle-list { flex: 1; overflow-y: auto; padding: 10px 12px; }

    .vehicle-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .vehicle-card:hover { border-color: #334155; }

    .vehicle-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .vehicle-color-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .vehicle-name { font-weight: 600; flex: 1; }

    .vehicle-status {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 4px;
      background: #1e293b;
      color: #475569;
    }

    .vehicle-status.en_route { background: #172554; color: #60a5fa; }
    .vehicle-coords { font-size: 11px; color: #475569; font-family: monospace; }
    .vehicle-meta { font-size: 11px; color: #334155; margin-top: 3px; }

    /* Status bar */
    #statusbar {
      height: 26px;
      background: #0f172a;
      border-top: 1px solid #1e293b;
      display: flex;
      align-items: center;
      padding: 0 14px;
      font-size: 11px;
      color: #334155;
      gap: 16px;
      flex-shrink: 0;
    }

    /* Vehicle map marker */
    .vehicle-marker-icon { background: none; border: none; }
    .vehicle-dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.8);
      box-shadow: 0 0 6px rgba(0,0,0,0.6);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 2px; }

    @media (max-width: 600px) { #sidebar { display: none; } }
  </style>
</head>
<body>

  <div id="topbar">
    <span class="logo">🚛 LiveHaul</span>
    <div id="companies-bar"></div>
    <div id="connection-status">
      <div class="status-dot" id="ws-dot"></div>
      <span id="ws-label">Connecting...</span>
    </div>
  </div>

  <div id="main">
    <div id="map"></div>
    <div id="sidebar">
      <div class="panel">
        <div class="panel-title">Fleet</div>
      </div>
      <div id="vehicle-list">
        <div style="color:#334155;font-size:13px;padding:8px 0;">Waiting for server...</div>
      </div>
    </div>
  </div>

  <div id="statusbar">
    <span id="tick-display">Tick —</span>
    <span id="game-time-display"></span>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="../src/config.js"></script>
  <script src="../src/map/map.js"></script>
  <script src="../src/websocket/client.js"></script>
  <script src="../src/ui/hud.js"></script>
  <script src="../src/main.js"></script>

</body>
</html>
